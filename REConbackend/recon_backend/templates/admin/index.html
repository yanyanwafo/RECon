{% extends "admin/index.html" %}
{% load static %}

{% block extrastyle %}
  {{ block.super }}
  <link rel="stylesheet" type="text/css" href="{% static 'admin/css/custom_admin.css' %}" />
  <style>
   
    body.dashboard,
    body.dashboard #container,
    body.dashboard #main,
    body.dashboard #content {
      background-color: #0f172a !important;
      color: #0f172a !important;
    }

    body.dashboard #content > h1 {
      color: #1e293b !important;
      font-size: 20px !important;
      font-weight: 500 !important;
      margin-bottom: 16px !important;
    }

    body.dashboard #content-main .module {
      background-color: #ffffff !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 4px !important;
      overflow: hidden !important;
      margin-bottom: 20px !important;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06) !important;
    }

    body.dashboard #content-main .module caption,
    body.dashboard #content-main .module h2 {
      background-color: #2f6f8e !important;
      color: #ffffff !important;
      font-size: 12px !important;
      font-weight: 600 !important;
      letter-spacing: 0.04em !important;
      text-transform: uppercase !important;
      padding: 9px 12px !important;
    }

    body.dashboard #content-main .module table {
      width: 100% !important;
      border-collapse: collapse !important;
      background-color: #ffffff !important;
    }

    body.dashboard #content-main .module table tr {
      background-color: #ffffff !important;
      border-bottom: 1px solid #e2e8f0 !important;
    }

    body.dashboard #content-main .module table tr:last-child {
      border-bottom: none !important;
    }

    body.dashboard #content-main .module table th,
    body.dashboard #content-main .module table td {
      background-color: #ffffff !important;
      color: #0f172a !important;
      padding: 9px 12px !important;
      font-size: 13px !important;
    }

    body.dashboard #content-main .module table th a {
      color: #2f6f8e !important;
      font-weight: 500 !important;
      text-decoration: none !important;
    }

    body.dashboard #content-main .module table th a:hover {
      text-decoration: underline !important;
    }

    body.dashboard #content-main .module table td a.addlink {
      color: #15803d !important;
      font-weight: 600 !important;
      text-decoration: none !important;
    }

    body.dashboard #content-main .module table td a.changelink {
      color: #334155 !important;
      font-weight: 500 !important;
      text-decoration: none !important;
    }

    body.dashboard #content-related,
    body.dashboard #content-related .module {
      background-color: #0f172a !important;
      border: 1px solid #065f46 !important;
      border-radius: 6px !important;
      overflow: hidden !important;
      color: #e2e8f0 !important;
    }

    body.dashboard #content-related .module h2 {
      background-color: #065f46 !important;
      color: #ffffff !important;
      padding: 10px 14px !important;
      font-size: 14px !important;
      font-weight: 600 !important;
    }

    body.dashboard #content-related .module h3 {
      color: #f8fafc !important;
      font-size: 13px !important;
      padding: 10px 14px 4px !important;
      margin: 0 !important;
    }

    body.dashboard #content-related .module ul {
      background-color: #0f172a !important;
      padding: 6px 14px 14px !important;
      margin: 0 !important;
    }

    body.dashboard #content-related .module ul li {
      color: #94a3b8 !important;
      font-size: 12px !important;
      margin-bottom: 8px !important;
    }

    body.dashboard #content-related .module ul li a {
      color: #ffffff !important;
      text-decoration: none !important;
    }
  </style>
{% endblock %}
